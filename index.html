<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jägermeister 8-Bit Quest</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        
        /* --- ФОН ЭКРАНА ВЫБОРА (JÄGERMEISTER 8-BIT) --- */
        #screen-character {
            background: linear-gradient(
                180deg,
                #000d00 0%,      /* небо — почти чёрное */
                #001a00 40%,     /* переход к лесу */
                #002200 70%,     /* тёмный лес */
                #001500 100%     /* земля */
            );
            position: relative;
        }

        /* Чтобы контент (лого, карточки, кнопки) был поверх фона и кликабельным */
        #screen-character > *:not(.jager-bg-layer) {
            position: relative;
            z-index: 10;
        }

        /* Контейнер для слоев фона */
        .jager-bg-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1;
            pointer-events: none;
            overflow: hidden;
        }

        /* Луна */
        .moon {
            position: absolute; 
            top: 8%; 
            right: 20%;
            width: 28px; 
            height: 28px;
            background: #C8A44A;
            border-radius: 50%;
            box-shadow: 0 0 15px rgba(200, 164, 74, 0.8), 0 0 30px rgba(200, 164, 74, 0.4);
        }

        /* Звёзды */
        .jager-star {
            width: 2px; 
            height: 2px;
            background: #ffffff;
            position: absolute;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 1; }
            50%      { opacity: 0.2; }
        }

        /* Деревья */
        .trees-wrapper {
            position: absolute;
            bottom: 0; left: 0; width: 100%; height: 100%;
        }

        .tree {
            position: absolute;
            bottom: 0;
            width: 20px;
        }

        /* Ствол */
        .tree::after {
            content: '';
            display: block;
            width: 6px;
            height: 16px;
            background: #3d1f00;
            margin: 0 auto;
        }

        /* Крона */
        .tree::before {
            content: '';
            display: block;
            width: 4px;
            height: 4px;
            background: #1a4a1a;
            margin: 0 auto;
            box-shadow:
                /* ярус 1 (верхушка) */
                -4px 4px 0 #1a4a1a,
                0px  4px 0 #2a6a2a,
                4px  4px 0 #1a4a1a,
                /* ярус 2 */
                -8px 8px 0 #1a4a1a,
                -4px 8px 0 #2a6a2a,
                0px  8px 0 #2a6a2a,
                4px  8px 0 #2a6a2a,
                8px  8px 0 #1a4a1a,
                /* ярус 3 (широкий) */
                -12px 12px 0 #1a4a1a,
                -8px  12px 0 #2a6a2a,
                -4px  12px 0 #1a5a1a,
                0px   12px 0 #2a6a2a,
                4px   12px 0 #1a5a1a,
                8px   12px 0 #2a6a2a,
                12px  12px 0 #1a4a1a,
                /* ярус 4 (основание кроны) */
                -12px 16px 0 #2a6a2a,
                -8px  16px 0 #1a5a1a,
                -4px  16px 0 #2a6a2a,
                0px   16px 0 #1a5a1a,
                4px   16px 0 #2a6a2a,
                8px   16px 0 #1a5a1a,
                12px  16px 0 #2a6a2a;
        }

        .tree:nth-child(1) { left: -2px;  height: 120px; transform: scale(1.4); }
        .tree:nth-child(2) { left: 18px;  height: 90px;  transform: scale(1.0); }
        .tree:nth-child(3) { left: 5px;   height: 105px; transform: scale(1.2); opacity: 0.7; }
        .tree:nth-child(4) { right: -2px; height: 115px; transform: scale(1.3); }
        .tree:nth-child(5) { right: 18px; height: 85px;  transform: scale(0.9); }
        .tree:nth-child(6) { right: 5px;  height: 100px; transform: scale(1.1); opacity: 0.7; }

        /* Земля */
        .ground {
            position: absolute; 
            bottom: 0;
            height: 16px; 
            width: 100%;
            background: #1a0a00;
            box-shadow: 0 -2px 0 #2a1500, 0 -4px 0 #1a0a00;
        }

        /* Туман */
        .fog {
            position: absolute; 
            bottom: 12px;
            height: 20px; 
            width: 100%;
            background: linear-gradient(
                180deg, 
                transparent 0%, 
                rgba(0, 60, 0, 0.3) 50%, /* --- ЦВЕТА КАРТЫ --- */
        :root {
            --jager-black:     #050f05;
            --jager-forest:    #1a4a1a;
            --jager-forest2:   #0d2a0d;
            --jager-gold:      #C8A44A;
            --jager-gold-dark: #8B6914;
            --jager-rock:      #3a3a3a;
            --jager-rock-dark: #1a1a1a;
            --jager-water:     #0a2030;
            --jager-water2:    #0d2a40;
            --jager-green:     #00843D;
        }

        /* --- RPG КАРТА WORLD MAP --- */
        .map-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
        .map-header img { width: 40px; }

        /* Прогресс-бар из 8 блоков */
        #progress-blocks { display: flex; gap: 4px; width: 100%; justify-content: center; margin-bottom: 20px; }
        .progress-block { flex: 1; height: 16px; background: #1a1a1a; border: 2px solid #333; }
        .progress-block.filled { background: var(--jager-green); border-color: var(--jager-gold); animation: fillBlock 0.3s ease-out forwards; }
        @keyframes fillBlock { from{opacity:0; transform:scaleX(0)} to{opacity:1; transform:scaleX(1)} }

        #map-container {
            width: 100%; height: 520px; position: relative; overflow: hidden;
            background: var(--jager-forest);
            background-image: 
                radial-gradient(circle, #2a6a2a 1px, transparent 1px),
                radial-gradient(circle, var(--jager-forest2) 1px, transparent 1px);
            background-size: 8px 8px, 12px 12px; background-position: 0 0, 4px 4px;
            border: 3px solid var(--jager-gold);
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8), 0 0 0 1px var(--jager-gold-dark), 0 0 0 5px var(--jager-black);
        }

        /* Виньетка леса */
        .forest-edge { position: absolute; pointer-events: none; z-index: 2; }
        .forest-edge.top { top: 0; left: 0; width: 100%; height: 40px; background: linear-gradient(to bottom, var(--jager-black), transparent); }
        .forest-edge.bottom { bottom: 0; left: 0; width: 100%; height: 40px; background: linear-gradient(to top, var(--jager-black), transparent); }
        .forest-edge.left { top: 0; left: 0; width: 40px; height: 100%; background: linear-gradient(to right, var(--jager-black), transparent); }
        .forest-edge.right { top: 0; right: 0; width: 40px; height: 100%; background: linear-gradient(to left, var(--jager-black), transparent); }

        /* Горы */
        .mountain-cluster { position: absolute; z-index: 3; }
        .mountain {
            width: 0; height: 0; border-left: 12px solid transparent; border-right: 12px solid transparent;
            border-bottom: 20px solid var(--jager-rock); position: relative; display: inline-block; margin: 0 -5px;
        }
        .mountain::before {
            content: ''; position: absolute; top: 8px; left: -5px;
            border-left: 5px solid transparent; border-right: 5px solid transparent; border-bottom: 8px solid var(--jager-gold);
        }
        .mountain::after {
            content: ''; position: absolute; top: 0; left: 6px;
            border-left: 6px solid transparent; border-right: 6px solid transparent; border-bottom: 20px solid var(--jager-rock-dark); opacity: 0.5;
        }
        .mountains-tl { top: 5%; left: 2%; } .mountains-tr { top: 8%; right: 3%; }
        .mountains-bl { bottom: 8%; left: 5%; } .mountains-br { bottom: 5%; right: 2%; }

        /* Пиксельные ели */
        .tree-pixel { position: absolute; z-index: 3; width: 8px; height: 14px; }
        .tree-pixel::after { content: ''; display: block; width: 3px; height: 4px; background: #3d1f00; position: absolute; bottom: 0; left: 2.5px; }
        .tree-pixel::before {
            content: ''; display: block; width: 0; height: 0; position: absolute; bottom: 4px; left: 4px;
            box-shadow: 
                -2px -2px 0 var(--jager-forest), 0 -2px 0 #2a6a2a, 2px -2px 0 var(--jager-forest),
                -4px 0 0 var(--jager-forest), -2px 0 0 #2a6a2a, 2px 0 0 #2a6a2a, 4px 0 0 var(--jager-forest),
                -4px 2px 0 #2a6a2a, -2px 2px 0 #1a5a1a, 2px 2px 0 #1a5a1a, 4px 2px 0 #2a6a2a;
        }

        /* Таверны (Бары) */
        .bar-pin {
            position: absolute; width: 40px; height: 44px;
            transform: translate(-50%, -50%); z-index: 6; cursor: pointer;
        }
        .tavern { position: relative; }
        .tavern-roof {
            width: 28px; height: 0; border-left: 6px solid transparent; border-right: 6px solid transparent;
            border-bottom: 10px solid #8B0000; margin: 0 auto; position: relative;
        }
        .tavern-roof::after {
            content: ''; position: absolute; top: -2px; left: 50%; transform: translateX(-50%);
            width: 4px; height: 4px; background: var(--jager-gold);
        }
        .tavern-body {
            width: 24px; height: 18px; background: #5a3a1a; margin: 0 auto; position: relative;
            box-shadow: inset -3px 0 0 #3a2010, inset 0 -2px 0 #3a2010;
        }
        .tavern-body::before {
            content: ''; position: absolute; box-shadow: 4px 4px 0 0 #FFD700, 14px 4px 0 0 #FFD700;
            width: 4px; height: 4px; background: #FFD700; top: 0; left: 0;
        }
        .tavern-body::after {
            content: ''; position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
            width: 5px; height: 8px; background: #2a1500; border-top: 2px solid #8B4513;
        }
        .tavern-sign {
            width: 20px; height: 6px; background: var(--jager-gold); margin: -1px auto 0;
            border: 1px solid var(--jager-gold-dark); font-size: 4px; text-align: center; color: #000; line-height: 6px;
        }
        .bar-name {
            font: 5px 'Press Start 2P'; color: var(--jager-gold); text-shadow: 1px 1px 0 #000;
            text-align: center; margin-top: 2px; white-space: nowrap; background: rgba(0,0,0,0.7); padding: 1px 3px;
        }
        .bar-marker {
            position: absolute; bottom: -2px; right: -4px; width: 12px; height: 12px; background: var(--jager-green);
            border: 1px solid var(--jager-gold); font: 6px 'Press Start 2P'; color: #fff; text-align: center; line-height: 12px;
        }

        .bar-pin.uncollected .tavern { filter: grayscale(80%) brightness(0.6); }
        .bar-status { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        .bar-pin.uncollected .bar-status::after {
            content: '?'; position: absolute; top: -14px; left: 50%; transform: translateX(-50%);
            font: 8px 'Press Start 2P'; color: #ff4444; text-shadow: 1px 1px 0 #000;
            animation: blinkStatus 0.8s steps(1) infinite;
        }
        .bar-pin.collected .tavern { filter: none; }
        .bar-pin.collected .bar-status::after {
            content: '✓'; position: absolute; top: -14px; left: 50%; transform: translateX(-50%);
            font: 8px 'Press Start 2P'; color: var(--jager-gold);
            animation: glowStatus 1.5s ease-in-out infinite;
        }

        @keyframes blinkStatus { 0%,100% { opacity: 1; } 50% { opacity: 0; } }
        @keyframes glowStatus {
            0%,100% { text-shadow: 0 0 4px var(--jager-gold); }
            50% { text-shadow: 0 0 12px var(--jager-gold), 0 0 20px var(--jager-gold); }
        }

        /* Персонаж на карте */
        .map-character {
            position: absolute; z-index: 10; width: 24px; height: 32px;
            image-rendering: pixelated; background-size: contain; background-repeat: no-repeat; background-position: center;
            mix-blend-mode: screen; animation: mapWalk 0.5s steps(2) infinite;
            transition: left 1s ease, top 1s ease;
            transform: translate(-50%, -100%);
        }
        .map-character::after {
            content: ''; width: 16px; height: 4px; background: rgba(0,0,0,0.4); border-radius: 50%;
            position: absolute; bottom: -2px; left: 4px; z-index: -1;
        }
        @keyframes mapWalk {
            0%,100% { transform: translate(-50%, -100%) translateY(0); }
            50% { transform: translate(-50%, -100%) translateY(-4px); }
        }

        /* Туман войны */
        .fog-of-war {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(ellipse at 50% 50%, transparent 30%, rgba(5,15,5,0.4) 70%, rgba(5,15,5,0.8) 100%);
            pointer-events: none; z-index: 8;
        }

        /* --- RPG МОДАЛЬНОЕ ОКНО --- */
        .rpg-modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7);
            display: none; justify-content: center; align-items: flex-end; z-index: 1000;
        }
        .rpg-modal {
            width: 100%; height: 48%; background: #1a1a2e; border-top: 4px solid #C8A44A;
            box-shadow: inset 4px 4px 0 #2a2a4e, inset -4px -4px 0 #0a0a1e, 0 -4px 0 #8B6914;
            display: flex; flex-direction: column; padding: 18px 25px; position: relative;
            box-sizing: border-box;
            animation: slide-up 0.3s ease-out;
        }
        @keyframes slide-up { from { transform: translateY(100%); } to { transform: translateY(0); } }
        
        .rpg-modal-right { 
            display: flex; 
            flex-direction: column; 
            width: 100%;
            align-items: center; 
            text-align: center;
            justify-content: flex-start;
        }
        
        .rpg-title { color: #C8A44A; font-size: 16px; margin: 0 0 10px 0; line-height: 1.3; text-shadow: 1px 1px 0 #000; }
        .rpg-artifact { color: #fff; font-size: 12px; margin: 0 0 10px 0; line-height: 1.4; }
        .rpg-hint { color: #ccc; font-size: 11px; line-height: 1.5; margin: 0 0 12px 0; max-width: 95%; }
        .rpg-status { font-size: 12px; margin: 0 0 15px 0; line-height: 1.4; font-weight: bold; }
        
        .rpg-buttons { 
            display: flex; 
            gap: 14px; 
            width: 100%;
            max-width: 320px; 
            margin: 0 auto;
            justify-content: center; 
            margin-top: auto; 
        }
        .rpg-modal .btn, .rpg-btn { 
            font-size: 10px !important; 
            padding: 14px 10px !important; 
            flex: 1 !important; 
            text-align: center !important; 
            background: #1b4d3e !important; 
            color: #ffffff !important;
            border: 2px solid #C8A44A !important;
            box-shadow: inset 2px 2px 0 #2e8b57, inset -2px -2px 0 #0d231c !important;
            cursor: pointer;
            display: block !important;
        }

        /* Статусы */
        .uncollected .indicator {
            animation: blink 1.5s infinite step-end;
        }
        .uncollected .indicator::before { content: '❓'; }

        .collected .building-icon {
            filter: grayscale(0%) sepia(100%) hue-rotate(5deg) saturate(300%); 
            animation: collected-glow 2s infinite;
            border-radius: 50%;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        @keyframes collected-glow {
            0%, 100% { box-shadow: 0 0 5px #C8A44A; background-color: rgba(200, 164, 74, 0.2); }
            50% { box-shadow: 0 0 15px #FFD700; background-color: rgba(255, 215, 0, 0.4); }
        }

        :root {
            --green: #00843D;
            --gold: #C8A44A;
            --black: #1A1A1A;
            --white: #F5F5F5;
            --dim: rgba(26, 26, 26, 0.85);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--black);
            color: var(--white);
            font-family: 'Press Start 2P', cursive;
            font-size: 12px;
            overflow: hidden;
            line-height: 1.5;
        }

        #app {
            width: 100vw;
            height: 100vh;
            padding-top: env(safe-area-inset-top, 20px);
            padding-bottom: env(safe-area-inset-bottom, 20px);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .screen {
            display: none;
            flex-direction: column;
            width: 100%;
            height: 100%;
            padding: 20px;
            position: absolute;
            top: 0;
            left: 0;
            background-color: var(--black);
        }

        .active-screen {
            display: flex;
        }

        /* Утилиты и компоненты */
        .pixel-border {
            box-shadow: 
                -4px 0 0 0 var(--green),
                4px 0 0 0 var(--green),
                0 -4px 0 0 var(--green),
                0 4px 0 0 var(--green);
            margin: 4px;
            background: var(--black);
        }

        .pixel-border.gold {
            box-shadow: 
                -4px 0 0 0 var(--gold),
                4px 0 0 0 var(--gold),
                0 -4px 0 0 var(--gold),
                0 4px 0 0 var(--gold);
        }

        .btn {
            background-color: var(--green);
            color: var(--white);
            border: none;
            padding: 15px;
            font-family: inherit;
            font-size: 14px;
            text-align: center;
            cursor: pointer;
            box-shadow: 
                -4px 0 0 0 var(--white),
                4px 0 0 0 var(--white),
                0 -4px 0 0 var(--white),
                0 4px 0 0 var(--white);
            margin: 20px auto;
            display: block;
            width: 80%;
            text-transform: uppercase;
        }

        .btn:active {
            transform: scale(0.95);
        }

        .title {
            text-align: center;
            color: var(--gold);
            margin-bottom: 20px;
            font-size: 16px;
        }

        .logo {
            width: 120px;
            margin: 0 auto 20px;
            image-rendering: pixelated;
        }

        #bottom-logo {
            width: 80%;
            max-width: 220px;
            margin: 40px auto 20px auto;
            display: block;
        }

        #screen-character .characters {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            margin-top: 30px;
        }

        .char-card {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px;
            cursor: pointer;
            transition: transform 0.2s;
            background: radial-gradient(ellipse at 50% 40%, #1a3a1a 0%, #050f05 100%) !important;
        }

      .char-card img {
            width: 80px;
            height: 80px;
            image-rendering: pixelated;
            margin-bottom: 10px;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.8));
        }

        @keyframes blinkGold {
            0%, 100% { box-shadow: -4px 0 0 0 var(--gold), 4px 0 0 0 var(--gold), 0 -4px 0 0 var(--gold), 0 4px 0 0 var(--gold); }
            50% { box-shadow: -4px 0 0 0 transparent, 4px 0 0 0 transparent, 0 -4px 0 0 transparent, 0 4px 0 0 transparent; }
        }

        .char-card.selected {
            animation: blinkGold 0.3s 2 forwards;
        }

        /* Экран 2 - Квест */
        #screen-quest {
            background-color: #0b0b0b;
        }

        .star {
            position: absolute;
            width: 4px;
            height: 4px;
            background: white;
            opacity: 0.5;
        }

       /* Анимация ходьбы для экрана квеста */
        @keyframes walkForwardBack {
            0%   { transform: translateX(0px) scaleX(1); }
            25%  { transform: translateX(12px) scaleX(1); }
            50%  { transform: translateX(12px) scaleX(-1); }
            75%  { transform: translateX(0px) scaleX(-1); }
            100% { transform: translateX(0px) scaleX(1); }
        }

        #quest-avatar {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 80px;  /* Было 48px */
            height: 80px; /* Было 48px */
            image-rendering: pixelated;
            animation: walkForwardBack 2.4s steps(4) infinite;
        }

        /* Стиль для нижнего логотипа на экране квеста */
        .logo-bottom-quest {
            display: block;
            width: 180px;
            margin: 16px auto 0;
            image-rendering: pixelated;
        }

        #quest-text-container {
            margin-top: 80px;
            min-height: 200px;
            line-height: 1.8;
            font-size: 14px;
        }

        #btn-to-map { display: none; }

        /* Экран 3 - Карта */
        .map-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .map-header img { width: 40px; }
        
        .progress-bar {
            width: 100%;
            height: 12px;
            background: #333;
            margin-bottom: 20px;
            box-shadow: 0 0 0 2px var(--white);
        }

        .progress-fill {
            height: 100%;
            background: var(--green);
            width: 0%;
            transition: width 0.3s;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 30px;
        }

        .slot {
            aspect-ratio: 1;
            background: #222;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 8px;
            text-align: center;
            box-shadow: inset 0 0 0 2px #444;
        }

        .slot.revealed {
            animation: pixelReveal 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            background: var(--black);
        }

        .slot-icon { font-size: 24px; margin-bottom: 5px; }

        @keyframes pixelReveal {
            from { opacity: 0; transform: scale(0.5); }
            to { opacity: 1; transform: scale(1); box-shadow: 0 0 0 2px var(--gold); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        #btn-elixir {
            display: none;
            background-color: var(--gold);
            color: var(--black);
            animation: pulse 1.5s infinite;
        }

        /* Экран 4 - Эликсир */
        #screen-elixir {
            justify-content: center;
            align-items: center;
        }

        .elixir-container {
            position: relative;
            width: 300px;
            height: 300px;
        }

        .flying-icon {
            position: absolute;
            font-size: 30px;

<body>

<script>
    // Инициализация Telegram SDK
    const tg = window.Telegram.WebApp;
    tg.ready();
    // ТВОЙ TELEGRAM ID (впиши сюда свой номер)
    const ADMIN_TG_ID = 620058644; 

    // Если приложение открыл админ — показываем панель
    if (tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.id === ADMIN_TG_ID) {
        document.getElementById('dev-panel').style.setProperty('display', 'flex', 'important');
    }
    tg.expand();
    tg.setHeaderColor('#1A1A1A');
    tg.setBackgroundColor('#1A1A1A');

    // Конфигурация и Данные
    const HUNTER_IMG_URL = "./assets/hunter.png";
    const HUNTIE_IMG_URL = "./assets/hanti.png";
    const INGREDIENTS = [
        { id: 1, name: "Имбирь", icon: "🫚", qrCode: "JAGER_BAR_1", bar: "Bar Name 1", hint: "Острый и жгучий корень", x: 20, y: 12 },
        { id: 2, name: "Корица", icon: "🌰", qrCode: "JAGER_BAR_2", bar: "Bar Name 2", hint: "Согревающая кора дерева", x: 75, y: 22 },
        { id: 3, name: "Звёздчатый анис", icon: "⭐", qrCode: "JAGER_BAR_3", bar: "Bar Name 3", hint: "Пряная звезда востока", x: 30, y: 35 },
        { id: 4, name: "Кардамон", icon: "🌿", qrCode: "JAGER_BAR_4", bar: "Bar Name 4", hint: "Семена тропического рая", x: 80, y: 48 },
        { id: 5, name: "Апельсиновая цедра", icon: "🍊", qrCode: "JAGER_BAR_5", bar: "Bar Name 5", hint: "Горькая корка померанца", x: 25, y: 60 },
        { id: 6, name: "Шафран", icon: "🌸", qrCode: "JAGER_BAR_6", bar: "Bar Name 6", hint: "Редчайшая специя мира", x: 70, y: 72 },
        { id: 7, name: "Можжевельник", icon: "🫐", qrCode: "JAGER_BAR_7", bar: "Bar Name 7", hint: "Лесные синие ягоды", x: 35, y: 85 },
        { id: 8, name: "Лакрица", icon: "🖤", qrCode: "JAGER_BAR_8", bar: "Bar Name 8", hint: "Сладкий корень солодки", x: 65, y: 92 }
    ];

    const STATE = {
        selectedCharacter: null,
        collectedIds: [],
        gameCompleted: false,
        currentScreen: 'screen-character'
    };

    // Web Audio API
    let audioCtx = null;
    function playBeep(freq, ms) {
        try {
            if (!audioCtx) {
                const AC = window.AudioContext || window.webkitAudioContext;
                if (!AC) return;
                audioCtx = new AC();
            }
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'square';
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + (ms/1000));
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            osc.start();
            osc.stop(audioCtx.currentTime + (ms/1000));
        } catch(e) { console.error('Audio play error:', e); }
    }

    // Хранение состояния
    const STORAGE_KEY = 'jager_quest_state';

    function saveState() {
        const data = JSON.stringify(STATE);
        try {
            if (tg.CloudStorage) {
                tg.CloudStorage.setItem(STORAGE_KEY, data, (err) => {
                    if (err) localStorage.setItem(STORAGE_KEY, data);
                });
            } else {
                localStorage.setItem(STORAGE_KEY, data);
            }
        } catch (e) {
            localStorage.setItem(STORAGE_KEY, data);
        }
    }

    function loadState(callback) {
        const parseState = (dataStr) => {
            if (dataStr) {
                try {
                    const parsed = JSON.parse(dataStr);
                    Object.assign(STATE, parsed);
                } catch(e) {}
            }
            callback();
        };

        try {
            if (tg.CloudStorage) {
                tg.CloudStorage.getItem(STORAGE_KEY, (err, val) => {
                    if (err || !val) {
                        parseState(localStorage.getItem(STORAGE_KEY));
                    } else {
                        parseState(val);
                    }
                });
            } else {
                parseState(localStorage.getItem(STORAGE_KEY));
            }
        } catch (e) {
            parseState(localStorage.getItem(STORAGE_KEY));
        }
    }

    // Навигация
    function navigateTo(screenId) {
        STATE.currentScreen = screenId;
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active-screen'));
        document.getElementById(screenId).classList.add('active-screen');
        saveState();

        if (screenId === 'screen-quest') initQuestScreen();
        if (screenId === 'screen-map') renderMap();
        if (screenId === 'screen-victory') initVictoryScreen();
        tg.MainButton.hide(); 
    }

    // Экран 1
    function selectCharacter(charId) {
        playBeep(440, 100);
        STATE.selectedCharacter = charId;
        
        document.querySelectorAll('.char-card').forEach(el => el.classList.remove('selected'));
        const activeCard = document.querySelector(`.char-card[data-char="${charId}"]`);
        activeCard.classList.add('selected');
        
        setTimeout(() => {
            document.getElementById('btn-start').style.display = 'block';
            saveState();
        }, 600);
    }

    // Экран 2
    let typeTimeout;
    let isTyping = false;
    const questTextStr = "Среди 56 секретных ингредиентов Jägermeister 8 главных затеряны по барам города. Твоя миссия — обойти бары, сканировать QR-коды и собрать все ингредиенты. Только тогда ты сможешь создать легендарный эликсир!";
    
    function initQuestScreen() {
        const avatarUrl = STATE.selectedCharacter === 'hunter' ? HUNTER_IMG_URL : HUNTIE_IMG_URL;
        document.getElementById('quest-avatar').src = avatarUrl;
        
        const starsContainer = document.getElementById('screen-quest');
        for(let i=0; i<15; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.animation = `pulse ${1 + Math.random()}s infinite alternate`;
            starsContainer.appendChild(star);
        }

        const textEl = document.getElementById('quest-text');
        textEl.innerText = "";
        document.getElementById('btn-to-map').style.display = "none";
        
        let charIdx = 0;
        isTyping = true;

        function nextChar() {
            if (!isTyping) return;
            if (charIdx < questTextStr.length) {
                textEl.innerText += questTextStr.charAt(charIdx);
                charIdx++;
                typeTimeout = setTimeout(nextChar, 35);
            } else {
                finishTyping();
            }
        }
        nextChar();
    }

    function skipTyping() {
        if(isTyping) finishTyping();
    }

    function finishTyping() {
        isTyping = false;
        clearTimeout(typeTimeout);
        document.getElementById('quest-text').innerText = questTextStr;
        setTimeout(() => {
            document.getElementById('btn-to-map').style.display = 'block';
        }, 500);
    }

   // Экран 3 - Новая функция рендера карты
    const BAR_POSITIONS = [
        { id:1, left:15, top:10 },
        { id:2, left:62, top:15 },
        { id:3, left:22, top:28 },
        { id:4, left:65, top:35 },
        { id:5, left:12, top:50 },
        { id:6, left:58, top:55 },
        { id:7, left:20, top:70 },
        { id:8, left:60, top:75 },
    ];

    function renderMap() {
        document.getElementById('progress-text').innerText = `СОБРАНО: ${STATE.collectedIds.length} / 8`;
        
        // 1. Отрисовка новых блоков прогресса
        const progressContainer = document.getElementById('progress-blocks');
        progressContainer.innerHTML = '';
        for (let i = 0; i < 8; i++) {
            const block = document.createElement('div');
            block.className = 'progress-block' + (i < STATE.collectedIds.length ? ' filled' : '');
            progressContainer.appendChild(block);
        }

        // 2. Генерация таверн (баров)
        const markersContainer = document.getElementById('map-markers');
        markersContainer.innerHTML = '';
        
        let pointsString = '';
        let lastCollectedLeft = null;
        let lastCollectedTop = null;

        BAR_POSITIONS.forEach((pos, index) => {
            const item = INGREDIENTS.find(ing => ing.id === pos.id);
            const isCollected = STATE.collectedIds.includes(item.id);

            // Собираем строку координат для SVG дорог
            pointsString += `${pos.left},${pos.top} `;

            if (isCollected) {
                lastCollectedLeft = pos.left;
                lastCollectedTop = pos.top;
            }

            const marker = document.createElement('div');
            marker.className = `bar-pin ${isCollected ? 'collected' : 'uncollected'}`;
            marker.style.left = `${pos.left}%`;
            marker.style.top = `${pos.top}%`;
            marker.onclick = () => openModal(item, isCollected, index + 1);

            marker.innerHTML = `
              <div class="tavern">
                <div class="tavern-roof"></div>
                <div class="tavern-body"></div>
                <div class="tavern-sign"></div>
              </div>
              <div class="bar-marker">${index + 1}</div>
              <div class="bar-status"></div>
              <div class="bar-name">${item.bar}</div>
            `;
            markersContainer.appendChild(marker);
        });

        // 3. Обновляем SVG-дороги
        const cleanPoints = pointsString.trim();
        document.getElementById('road-shadow').setAttribute('points', cleanPoints);
        document.getElementById('road-main').setAttribute('points', cleanPoints);
        document.getElementById('road-highlight').setAttribute('points', cleanPoints);

        // 4. Позиционирование увеличенного персонажа
        const player = document.getElementById('player-sprite');
        const avatarUrl = STATE.selectedCharacter === 'huntie' ? './assets/hanti.png' : './assets/hunter.png';
        player.style.backgroundImage = `url('${avatarUrl}')`;

        if (lastCollectedLeft !== null) {
            player.style.display = 'block';
            player.style.left = `${lastCollectedLeft}%`;
            player.style.top = `${lastCollectedTop}%`;
        } else if (BAR_POSITIONS.length > 0) {
            player.style.display = 'block';
            player.style.left = `${BAR_POSITIONS[0].left}%`;
            player.style.top = `${BAR_POSITIONS[0].top}%`;
        }

        if (STATE.collectedIds.length === 8) {
            document.getElementById('btn-elixir').style.display = 'block';
        } else {
            document.getElementById('btn-elixir').style.display = 'none';
        }
    }

    function openModal(item, isCollected, stepNum) {
        document.getElementById('rpg-title').innerText = item.bar;
        
        if (isCollected) {
            document.getElementById('rpg-artifact').innerText = `Артефакт: ${item.name} ${item.icon}`;
            document.getElementById('rpg-hint').innerText = item.hint;
            document.getElementById('rpg-status').innerHTML = '✅ СОБРАН';
            document.getElementById('rpg-status').style.color = "#4CAF50";
            document.getElementById('btn-scan').style.display = 'none';
        } else {
            document.getElementById('rpg-artifact').innerText = 'Артефакт: Неизвестно';
            document.getElementById('rpg-hint').innerText = `Следуй в эту локацию. Подсказка: ${item.hint}`;
            document.getElementById('rpg-status').innerHTML = '❌ НЕ СОБРАН';
            document.getElementById('rpg-status').style.color = "#ff4444";
            document.getElementById('btn-scan').style.display = 'block';
        }
        
        document.getElementById('rpg-modal-overlay').style.display = 'flex';
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.HapticFeedback.impactOccurred('light');
        }
    }

    function closeModal() {
        document.getElementById('rpg-modal-overlay').style.display = 'none';
    }

    function openScanner() {
        tg.showScanQrPopup({ text: "Наведи камеру на QR-код в баре" }, (scannedText) => {
            handleQrScan(scannedText);
            return true; 
        });
    }

    function handleQrScan(text) {
        const ing = INGREDIENTS.find(i => i.qrCode === text);
        if (!ing) {
            tg.showAlert("❌ Неверный QR-код. Попробуй в другом баре!");
            return;
        }
        if (STATE.collectedIds.includes(ing.id)) {
            tg.showAlert("✅ Этот ингредиент уже собран!");
            return;
        }

        // Новый ингредиент
        STATE.collectedIds.push(ing.id);
        saveState();
        tg.HapticFeedback.notificationOccurred('success');
        
        // Мелодия победы
        setTimeout(() => playBeep(523, 200), 0);
        setTimeout(() => playBeep(659, 200), 250);

        closeModal();
        renderMap(); // Перерисовка с обновленным прогрессом
        const slot = document.getElementById(`slot-${ing.id}`);
        if(slot) slot.classList.add('revealed');
    }

    // Экран 4
    function startElixirAnimation() {
        STATE.gameCompleted = true;
        saveState();
        navigateTo('screen-elixir');
        
        const container = document.getElementById('elixir-container');
        const radius = 120;
        
        // Создаем иконки по кругу
        INGREDIENTS.forEach((ing, i) => {
            const angle = (i / 8) * (2 * Math.PI);
            const el = document.createElement('div');
            el.className = 'flying-icon';
            el.innerText = ing.icon;
            
            const x = Math.cos(angle) * radius;
            const y = Math.sin(angle) * radius;
            el.style.transform = `translate(${x}px, ${y}px)`;
            
            container.appendChild(el);
            
            // Запуск стягивания к центру
            setTimeout(() => {
                el.style.transform = 'translate(0, 0)';
            }, 100);
        });

        // Нарастающая мелодия
        const notes = [261, 329, 392, 523];
        notes.forEach((freq, idx) => {
            setTimeout(() => playBeep(freq, 150), 100 + (idx * 200));
        });

        setTimeout(() => {
            document.querySelectorAll('.flying-icon').forEach(el => el.style.opacity = '0');
            const flash = document.getElementById('flash-overlay');
            flash.style.opacity = '1';
            
            setTimeout(() => {
                flash.style.transition = 'opacity 0.5s';
                flash.style.opacity = '0';
                const bottle = document.getElementById('big-bottle');
                bottle.style.transform = 'translate(-50%, -50%) scale(1)';
                bottle.style.opacity = '1';
            }, 200);

            setTimeout(() => {
                navigateTo('screen-victory');
            }, 2500);

        }, 800);
    }

    // Экран 5
    function initVictoryScreen() {
        document.getElementById('winner-name').innerText = STATE.selectedCharacter.toUpperCase();
        
        const container = document.getElementById('screen-victory');
        for(let i=0; i<20; i++) {
            const conf = document.createElement('div');
            conf.className = 'confetti';
            conf.style.left = Math.random() * 100 + '%';
            conf.style.backgroundColor = Math.random() > 0.5 ? 'var(--green)' : 'var(--gold)';
            conf.style.animationDuration = (Math.random() * 2 + 2) + 's';
            conf.style.animationDelay = (Math.random() * 2) + 's';
            container.appendChild(conf);
        }
    }

    function selectPrize(element) {
        document.querySelectorAll('.prize-card').forEach(el => el.classList.add('dim'));
        element.classList.remove('dim');
        
        tg.HapticFeedback.notificationOccurred('success');
        
        const msg = document.getElementById('prize-msg');
        msg.style.display = 'block';
        msg.innerText = "ОТЛИЧНЫЙ ВЫБОР! 🎯 Покажи этот экран бармену для получения приза.";
        
        tg.MainButton.setText('✅ ПОКАЗАТЬ БАРМЕНУ').show();
        tg.MainButton.onClick(() => {
            tg.showAlert("Приз выдан! Наслаждайся Jägermeister!");
            tg.MainButton.hide();
        });
    }

    function confirmReset() {
        tg.showConfirm("Сбросить прогресс и начать заново?", (ok) => {
            if(ok) resetGame();
        });
    }

    function resetGame() {
        STATE.selectedCharacter = null;
        STATE.collectedIds = [];
        STATE.gameCompleted = false;
        STATE.currentScreen = 'screen-character';
        
        if(tg.CloudStorage) tg.CloudStorage.removeItem(STORAGE_KEY);
        localStorage.removeItem(STORAGE_KEY);
        
        document.querySelectorAll('.char-card').forEach(el => el.classList.remove('selected'));
        document.getElementById('btn-start').style.display = 'none';
        document.getElementById('prize-msg').style.display = 'none';
        document.querySelectorAll('.prize-card').forEach(el => el.classList.remove('dim'));
        document.getElementById('elixir-container').innerHTML = '<div id="big-bottle" class="big-bottle">🍾</div>';
        
        document.querySelectorAll('.confetti').forEach(e => e.remove());
        
        navigateTo('screen-character');
    }

    // Загрузка при старте
    loadState(() => {
        if (STATE.currentScreen && document.getElementById(STATE.currentScreen)) {
            navigateTo(STATE.currentScreen);
        } else {
            navigateTo('screen-character');
        }
    });
    // ==========================================
    // --- ФУНКЦИИ ДЛЯ ТЕСТИРОВАНИЯ (DEV) ---
    // ==========================================
    
    // Эмулирует сканирование одного (следующего) QR-кода
    function devAddQR() {
        const missing = INGREDIENTS.find(i => !STATE.collectedIds.includes(i.id));
        if (missing) {
            handleQrScan(missing.qrCode);
        } else {
            tg.showAlert("Все 8 ингредиентов уже собраны!");
        }
    }

    // Мгновенно собирает все 8 ингредиентов
    function devWin() {
        STATE.collectedIds = [1, 2, 3, 4, 5, 6, 7, 8];
        saveState();
        if (STATE.currentScreen === 'screen-map') {
            renderMap();
        } else {
            navigateTo('screen-map');
        }
        tg.showAlert("Чит активирован: Собраны все ингредиенты!");
    }

</script>
</body>
</html>
