<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jägermeister 8-Bit Quest</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        /* --- БАЗОВЫЕ ПЕРЕМЕННЫЕ И ЦВЕТА --- */
        :root {
            --green: #00843D;
            --gold: #C8A44A;
            --black: #1A1A1A;
            --white: #F5F5F5;
            --dim: rgba(26, 26, 26, 0.85);

            /* Цвета изометрической карты */
            --jager-black:     #050f05;
            --jager-forest:    #1a4a1a;
            --jager-forest2:   #0d2a0d;
            --jager-gold-dark: #8B6914;
            --jager-rock:      #3a3a3a;
            --jager-rock-dark: #1a1a1a;
            --jager-water:     #0a2030;
            --jager-water2:    #0d2a40;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--black); color: var(--white); font-family: 'Press Start 2P', cursive; font-size: 12px; overflow: hidden; line-height: 1.5; }
        #app { width: 100vw; height: 100vh; padding-top: env(safe-area-inset-top, 20px); padding-bottom: env(safe-area-inset-bottom, 20px); display: flex; flex-direction: column; position: relative; }
        .screen { display: none; flex-direction: column; width: 100%; height: 100%; padding: 20px; position: absolute; top: 0; left: 0; background-color: var(--black); }
        .active-screen { display: flex; }

        /* --- УТИЛИТЫ И КОМПОНЕНТЫ --- */
        .pixel-border { box-shadow: -4px 0 0 0 var(--green), 4px 0 0 0 var(--green), 0 -4px 0 0 var(--green), 0 4px 0 0 var(--green); margin: 4px; background: var(--black); }
        .pixel-border.gold { box-shadow: -4px 0 0 0 var(--gold), 4px 0 0 0 var(--gold), 0 -4px 0 0 var(--gold), 0 4px 0 0 var(--gold); }
        .btn { background-color: var(--green); color: var(--white); border: none; padding: 15px; font-family: inherit; font-size: 14px; text-align: center; cursor: pointer; box-shadow: -4px 0 0 0 var(--white), 4px 0 0 0 var(--white), 0 -4px 0 0 var(--white), 0 4px 0 0 var(--white); margin: 20px auto; display: block; width: 80%; text-transform: uppercase; }
        .btn:active { transform: scale(0.95); }
        .title { text-align: center; color: var(--gold); margin-bottom: 20px; font-size: 16px; }
        .logo { width: 120px; margin: 0 auto 20px; image-rendering: pixelated; }
        #bottom-logo { width: 80%; max-width: 220px; margin: 40px auto 20px auto; display: block; }

        /* --- ЭКРАН 1: ВЫБОР ПЕРСОНАЖА --- */
        #screen-character { background: linear-gradient(180deg, #000d00 0%, #001a00 40%, #002200 70%, #001500 100%); position: relative; }
        #screen-character > *:not(.jager-bg-layer) { position: relative; z-index: 10; }
        .jager-bg-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; overflow: hidden; }
        .moon { position: absolute; top: 8%; right: 20%; width: 28px; height: 28px; background: #C8A44A; border-radius: 50%; box-shadow: 0 0 15px rgba(200, 164, 74, 0.8), 0 0 30px rgba(200, 164, 74, 0.4); }
        .jager-star { width: 2px; height: 2px; background: #ffffff; position: absolute; }
        @keyframes twinkle { 0%, 100% { opacity: 1; } 50% { opacity: 0.2; } }
        .trees-wrapper { position: absolute; bottom: 0; left: 0; width: 100%; height: 100%; }
        .tree { position: absolute; bottom: 0; width: 20px; }
        .tree::after { content: ''; display: block; width: 6px; height: 16px; background: #3d1f00; margin: 0 auto; }
        .tree::before { content: ''; display: block; width: 4px; height: 4px; background: #1a4a1a; margin: 0 auto; box-shadow: -4px 4px 0 #1a4a1a, 0px 4px 0 #2a6a2a, 4px 4px 0 #1a4a1a, -8px 8px 0 #1a4a1a, -4px 8px 0 #2a6a2a, 0px 8px 0 #2a6a2a, 4px 8px 0 #2a6a2a, 8px 8px 0 #1a4a1a, -12px 12px 0 #1a4a1a, -8px 12px 0 #2a6a2a, -4px 12px 0 #1a5a1a, 0px 12px 0 #2a6a2a, 4px 12px 0 #1a5a1a, 8px 12px 0 #2a6a2a, 12px 12px 0 #1a4a1a, -12px 16px 0 #2a6a2a, -8px 16px 0 #1a5a1a, -4px 16px 0 #2a6a2a, 0px 16px 0 #1a5a1a, 4px 16px 0 #2a6a2a, 8px 16px 0 #1a5a1a, 12px 16px 0 #2a6a2a; }
        .tree:nth-child(1) { left: -2px; height: 120px; transform: scale(1.4); }
        .tree:nth-child(2) { left: 18px; height: 90px; transform: scale(1.0); }
        .tree:nth-child(3) { left: 5px; height: 105px; transform: scale(1.2); opacity: 0.7; }
        .tree:nth-child(4) { right: -2px; height: 115px; transform: scale(1.3); }
        .tree:nth-child(5) { right: 18px; height: 85px; transform: scale(0.9); }
        .tree:nth-child(6) { right: 5px; height: 100px; transform: scale(1.1); opacity: 0.7; }
        .ground { position: absolute; bottom: 0; height: 16px; width: 100%; background: #1a0a00; box-shadow: 0 -2px 0 #2a1500, 0 -4px 0 #1a0a00; }
        .fog { position: absolute; bottom: 12px; height: 20px; width: 100%; background: linear-gradient(180deg, transparent 0%, rgba(0, 60, 0, 0.3) 50%, rgba(0, 40, 0, 0.5) 100%); }

        #screen-character .characters { display: flex; justify-content: space-between; gap: 15px; margin-top: 30px; }
        .char-card { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 10px; cursor: pointer; transition: transform 0.2s; background: radial-gradient(ellipse at 50% 40%, #1a3a1a 0%, #050f05 100%) !important; }
        .char-card img { width: 80px; height: 80px; image-rendering: pixelated; margin-bottom: 10px; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.8)); }
        @keyframes blinkGold { 0%, 100% { box-shadow: -4px 0 0 0 var(--gold), 4px 0 0 0 var(--gold), 0 -4px 0 0 var(--gold), 0 4px 0 0 var(--gold); } 50% { box-shadow: -4px 0 0 0 transparent, 4px 0 0 0 transparent, 0 -4px 0 0 transparent, 0 4px 0 0 transparent; } }
        .char-card.selected { animation: blinkGold 0.3s 2 forwards; }

        /* --- ЭКРАН 2: КВЕСТ --- */
        #screen-quest { background-color: #0b0b0b; }
        .star { position: absolute; width: 4px; height: 4px; background: white; opacity: 0.5; }
        @keyframes walkForwardBack { 0% { transform: translateX(0px) scaleX(1); } 25% { transform: translateX(12px) scaleX(1); } 50% { transform: translateX(12px) scaleX(-1); } 75% { transform: translateX(0px) scaleX(-1); } 100% { transform: translateX(0px) scaleX(1); } }
        #quest-avatar { position: absolute; top: 20px; right: 20px; width: 80px; height: 80px; image-rendering: pixelated; animation: walkForwardBack 2.4s steps(4) infinite; }
        #quest-text-container { margin-top: 80px; min-height: 200px; line-height: 1.8; font-size: 14px; }
        #btn-to-map { display: none; }
        .logo-bottom-quest { display: block; width: 180px; margin: 16px auto 0; image-rendering: pixelated; }

        /* --- ЭКРАН 3: ИЗОМЕТРИЧЕСКАЯ КАРТА --- */
        .map-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
        .map-header img { width: 40px; }
        #progress-blocks { display: flex; gap: 4px; width: 100%; justify-content: center; margin-bottom: 20px; }
        .progress-block { flex: 1; height: 16px; background: #1a1a1a; border: 2px solid #333; }
        .progress-block.filled { background: var(--green); border-color: var(--gold); animation: fillBlock 0.3s ease-out forwards; }
        @keyframes fillBlock { from{opacity:0; transform:scaleX(0)} to{opacity:1; transform:scaleX(1)} }

        .map-container { width: 100%; height: 520px; position: relative; overflow: hidden; background: var(--jager-forest); border: 4px solid var(--gold); box-shadow: inset 0 0 30px rgba(0,0,0,0.6), 0 0 0 2px var(--jager-gold-dark), 0 0 0 6px var(--jager-black), 4px 4px 0 6px #000; }
        .map-decor { position: absolute; color: var(--gold); font-size: 12px; z-index: 10; }
        .map-decor.top-left { top: 4px; left: 4px; }
        .map-decor.bottom-right { bottom: 4px; right: 4px; }

        #iso-terrain, #iso-river { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        .iso-tile { width: 64px; height: 32px; position: absolute; transform: rotate(0deg); clip-path: polygon(50% 0%, 100% 25%, 50% 50%, 0% 25%); }
        .tile-grass { background: var(--jager-forest); }
        .tile-grass2 { background: var(--jager-forest2); }
        .tile-water { background: var(--jager-water); }
        .tile-water::after { content: ''; position: absolute; width: 60%; height: 1px; top: 40%; left: 20%; background: rgba(100,180,255,0.3); animation: waterShimmer 2s ease-in-out infinite; }
        @keyframes waterShimmer { 0%,100% { opacity: 0.3; transform: translateX(0); } 50% { opacity: 0.8; transform: translateX(4px); } }

        #iso-trees { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }
        .iso-tree { position: absolute; width: 24px; height: 34px; transform: translate(-50%, -100%); }
        .iso-tree::before { content: ''; position: absolute; bottom: 2px; left: 50%; transform: translateX(-50%); width: 20px; height: 8px; background: rgba(0,0,0,0.4); clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%); }
        .iso-tree-trunk { width: 4px; height: 10px; background: #3d1f00; margin: 0 auto; position: absolute; bottom: 4px; left: 50%; transform: translateX(-50%); }
        .iso-tree-top { width: 0; height: 0; border-left: 12px solid transparent; border-right: 12px solid transparent; border-bottom: 24px solid var(--jager-forest); position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%); filter: drop-shadow(-2px 2px 0 var(--jager-forest2)); }
        .iso-tree-top::before { content: ''; position: absolute; top: 8px; left: -8px; border-left: 8px solid transparent; border-right: 8px solid transparent; border-bottom: 16px solid #2a6a2a; }
        .iso-tree-top::after { content: ''; position: absolute; top: 14px; left: -5px; border-left: 5px solid transparent; border-right: 5px solid transparent; border-bottom: 10px solid #3a8a3a; }

        .bar-pin { position: absolute; width: 48px; height: 60px; transform: translate(-50%, -50%); z-index: 6; cursor: pointer; }
        .iso-building { position: absolute; width: 48px; height: 60px; }
        .iso-building::before { content: ''; position: absolute; bottom: -8px; left: -4px; width: 56px; height: 14px; background: rgba(0,0,0,0.35); clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%); }
        .iso-roof { position: absolute; top: 0; left: 0; width: 48px; height: 20px; background: #8B0000; clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%); background-image: repeating-linear-gradient(90deg, transparent, transparent 6px, rgba(0,0,0,0.2) 6px, rgba(0,0,0,0.2) 7px); }
        .iso-roof::after { content: ''; position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 4px; height: 4px; background: var(--gold); box-shadow: 0 4px 0 var(--gold), 0 8px 0 var(--gold); }
        .iso-front { position: absolute; bottom: 0; left: 0; width: 24px; height: 36px; background: #5a3a1a; transform: skewY(26.57deg); transform-origin: left bottom; background-image: linear-gradient(transparent 25%, #FFD700 25%, #FFD700 45%, transparent 45%), linear-gradient(transparent 25%, #FFD700 25%, #FFD700 45%, transparent 45%); background-size: 8px 100%, 8px 100%; background-position: 4px 0, 14px 0; background-repeat: no-repeat; }
        .iso-side { position: absolute; bottom: 0; right: 0; width: 24px; height: 36px; background: #3a2010; transform: skewY(-26.57deg); transform-origin: right bottom; }
        .iso-sign { position: absolute; top: 22px; left: 4px; background: var(--gold); color: #000; font: 4px 'Press Start 2P'; padding: 1px 2px; z-index: 2; white-space: nowrap; box-shadow: 1px 1px 0 var(--jager-gold-dark); }
        
        .bar-status { position: absolute; top: -16px; left: 50%; transform: translateX(-50%); font: 8px 'Press Start 2P'; z-index: 10; }
        .bar-pin.uncollected .bar-status::after { content: '?'; color: #ff4444; text-shadow: 1px 1px 0 #000; animation: blink 0.8s steps(1) infinite; }
        .bar-pin.collected .iso-building { filter: drop-shadow(0 0 6px var(--gold)); animation: collectedGlow 2s ease-in-out infinite; }
        .bar-pin.collected .bar-status::after { content: '✓'; color: var(--gold); }
        @keyframes collectedGlow { 0%,100% { filter: drop-shadow(0 0 4px var(--gold)); } 50% { filter: drop-shadow(0 0 12px var(--gold)); } }
        @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0; } }

        .bar-number { position: absolute; bottom: -4px; right: -4px; width: 14px; height: 14px; background: var(--green); border: 1px solid var(--gold); color: #fff; font: 6px 'Press Start 2P'; text-align: center; line-height: 14px; z-index: 10; }
        .bar-name { position: absolute; bottom: -18px; left: 50%; transform: translateX(-50%); font: 5px 'Press Start 2P'; color: var(--gold); white-space: nowrap; text-shadow: 1px 1px 0 #000; background: rgba(0,0,0,0.75); padding: 1px 3px; z-index: 11; }

        .map-hero { position: absolute; z-index: 20; width: 28px; height: 36px; image-rendering: pixelated; background-size: contain; background-repeat: no-repeat; background-position: center; mix-blend-mode: screen; animation: isoWalk 0.6s steps(4) infinite; transition: left 1.2s cubic-bezier(0.4,0,0.2,1), top 1.2s cubic-bezier(0.4,0,0.2,1); transform: translate(-50%, -100%); }
        .map-hero::after { content: ''; position: absolute; bottom: -3px; left: 50%; transform: translateX(-50%); width: 18px; height: 6px; background: rgba(0,0,0,0.4); clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%); z-index: -1; }
        @keyframes isoWalk { 0%,100% { transform: translate(-50%, -100%) translateY(0) scaleX(1); } 25% { transform: translate(-50%, -100%) translateY(-3px) scaleX(1); } 50% { transform: translate(-50%, -100%) translateY(0) scaleX(1); } 75% { transform: translate(-50%, -100%) translateY(-3px) scaleX(1); } }

        /* --- ИЗОМЕТРИЧЕСКОЕ МОДАЛЬНОЕ ОКНО --- */
        .iso-modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: none; justify-content: flex-start; align-items: flex-end; z-index: 1000; }
        .iso-modal { width: 100%; height: 38%; background: #0d1a0d; border-top: 3px solid var(--gold); box-shadow: 0 -4px 0 var(--jager-gold-dark), 0 -6px 0 var(--jager-black); display: flex; flex-direction: column; padding: 15px; position: relative; box-sizing: border-box; animation: slideUp 0.3s ease-out; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .iso-modal-content { display: flex; flex-direction: row; width: 100%; margin-bottom: 10px; }
        .iso-modal-left { width: 50px; display: flex; justify-content: center; align-items: center; position: relative; }
        .iso-modal-left .iso-building { position: relative; width: 40px; height: 50px; transform: scale(0.8); left: auto; top: auto; bottom: auto; right: auto; margin-top: 10px; }
        .iso-modal-right { display: flex; flex-direction: column; flex-grow: 1; margin-left: 15px; justify-content: flex-start; text-align: left; }
        .rpg-title { color: var(--gold); font-size: 14px; margin: 0 0 8px 0; line-height: 1.2; text-shadow: 1px 1px 0 #000; }
        .rpg-artifact { color: #fff; font-size: 10px; margin: 0 0 8px 0; line-height: 1.4; }
        .rpg-hint { color: #ccc; font-size: 9px; line-height: 1.5; margin: 0 0 10px 0; }
        .rpg-status { font-size: 10px; margin: 0; line-height: 1.4; font-weight: bold; }
        .rpg-buttons { display: flex; gap: 10px; width: 100%; justify-content: center; margin-top: auto; }
        .rpg-modal .btn, .rpg-btn { font-size: 8px !important; padding: 12px 10px !important; flex: 1 !important; text-align: center !important; background: var(--green) !important; color: #ffffff !important; border: 2px solid var(--gold) !important; box-shadow: inset 2px 2px 0 #2e8b57, inset -2px -2px 0 #0d231c !important; cursor: pointer; display: block !important; }
        .iso-cursor { position: absolute; bottom: 10px; right: 15px; color: #fff; font-size: 10px; animation: blink 1s infinite; }

        /* --- ЭКРАН 4 И 5: ЭЛИКСИР И ПОБЕДА --- */
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
        #btn-elixir { display: none; background-color: var(--gold); color: var(--black); animation: pulse 1.5s infinite; }
        #screen-elixir { justify-content: center; align-items: center; }
        .elixir-container { position: relative; width: 300px; height: 300px; }
        .flying-icon { position: absolute; font-size: 30px; transition: transform 0.6s ease-in, opacity 0.3s; top: 135px; left: 135px; }
        .big-bottle { position: absolute; font-size: 80px; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0); opacity: 0; transition: all 0.3s; }
        .flash { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: white; opacity: 0; pointer-events: none; z-index: 10; }
        #screen-victory { text-align: center; position: relative; }
        .confetti { position: absolute; width: 8px; height: 8px; top: -10px; animation: fall linear forwards; }
        @keyframes fall { to { transform: translateY(100vh) rotate(360deg); } }
        .prizes { display: flex; gap: 15px; margin-top: 30px; }
        .prize-card { flex: 1; padding: 20px 10px; cursor: pointer; transition: opacity 0.3s; }
        .prize-card.dim { opacity: 0.3; }
        .prize-icon { font-size: 40px; margin-bottom: 10px; }
        #btn-reset { margin-top: auto; background: transparent; color: #777; box-shadow: none; text-decoration: underline; padding: 10px; font-size: 10px; }
    </style>
</head>
<body>
<!-- ПАНЕЛЬ РАЗРАБОТЧИКА (УДАЛИТЬ ИЛИ СКРЫТЬ ПЕРЕД РЕЛИЗОМ!) -->
    <div id="dev-panel" style="position: fixed; top: 0; left: 0; z-index: 9999; background: rgba(0,0,0,0.8); border: 1px solid #0f0; border-top: none; border-left: none; border-bottom-right-radius: 8px; padding: 5px; gap: 5px; flex-wrap: wrap; display: none !important;">
        <button onclick="resetGame()" style="font-size: 8px; padding: 5px; background: #ff4444; color: white; border: none; cursor: pointer;">СБРОС</button>
        <button onclick="navigateTo('screen-character')" style="font-size: 8px; padding: 5px; cursor: pointer;">ГЕРОЙ</button>
        <button onclick="navigateTo('screen-map')" style="font-size: 8px; padding: 5px; cursor: pointer;">КАРТА</button>
        <button onclick="navigateTo('screen-victory')" style="font-size: 8px; padding: 5px; cursor: pointer;">ПОБЕДА</button>
        <button onclick="devAddQR()" style="font-size: 8px; padding: 5px; background: #00843D; color: white; border: none; cursor: pointer;">+1 QR</button>
        <button onclick="devWin()" style="font-size: 8px; padding: 5px; background: #C8A44A; color: black; border: none; cursor: pointer;">🏆 ВСЕ 8</button>
    </div>
<div id="app">
    <!-- ЭКРАН 1: Выбор персонажа -->
    <div id="screen-character" class="screen active-screen">
        
        <!-- НОВЫЙ ФОН: JÄGERMEISTER 8-BIT -->
        <div class="jager-bg-layer">
            <div class="moon"></div>
            
            <!-- 15 Звёзд -->
            <div class="jager-star" style="top: 5%; left: 10%; animation: twinkle 1s infinite 0.1s;"></div>
            <div class="jager-star" style="top: 15%; left: 25%; animation: twinkle 1.5s infinite 0.5s;"></div>
            <div class="jager-star" style="top: 8%; left: 45%; animation: twinkle 2s infinite 1.2s;"></div>
            <div class="jager-star" style="top: 25%; left: 15%; animation: twinkle 1.2s infinite 0.3s;"></div>
            <div class="jager-star" style="top: 30%; left: 35%; animation: twinkle 1.8s infinite 0.8s;"></div>
            <div class="jager-star" style="top: 12%; left: 60%; animation: twinkle 1.4s infinite 0.2s;"></div>
            <div class="jager-star" style="top: 22%; left: 75%; animation: twinkle 2.2s infinite 1.5s;"></div>
            <div class="jager-star" style="top: 5%; left: 85%; animation: twinkle 1.6s infinite 0.9s;"></div>
            <div class="jager-star" style="top: 32%; left: 55%; animation: twinkle 1.9s infinite 0.4s;"></div>
            <div class="jager-star" style="top: 18%; left: 90%; animation: twinkle 1.3s infinite 1.1s;"></div>
            <div class="jager-star" style="top: 28%; left: 85%; animation: twinkle 2.1s infinite 0.7s;"></div>
            <div class="jager-star" style="top: 10%; left: 30%; animation: twinkle 1.7s infinite 0.6s;"></div>
            <div class="jager-star" style="top: 34%; left: 5%; animation: twinkle 1.1s infinite 1.3s;"></div>
            <div class="jager-star" style="top: 20%; left: 50%; animation: twinkle 2.5s infinite 0.2s;"></div>
            <div class="jager-star" style="top: 14%; left: 70%; animation: twinkle 1.4s infinite 1.0s;"></div>

            <!-- Пиксельные деревья -->
            <div class="trees-wrapper">
                <div class="tree"></div>
                <div class="tree"></div>
                <div class="tree"></div>
                <div class="tree"></div>
                <div class="tree"></div>
                <div class="tree"></div>
            </div>
            
            <div class="ground"></div>
            <div class="fog"></div>
        </div>
        <!-- КОНЕЦ ФОНА -->

        <img id="main-logo" class="logo" alt="Jägermeister" src="./assets/logo.png">
        <h1 class="title">ВЫБЕРИ ОХОТНИКА</h1>
        <div class="characters">
            <div class="char-card pixel-border" data-char="hunter" onclick="selectCharacter('hunter')">
                <img src="./assets/hunter.png" alt="Hunter">
                <span>HUNTER</span>
            </div>
            <div class="char-card pixel-border" data-char="huntie" onclick="selectCharacter('huntie')">
                <img src="./assets/hanti.png" alt="Huntie">
                <span>HUNTIE</span>
            </div>
        </div>

        <img id="bottom-logo" src="./assets/logo-bottom.png" alt="Jägermeister">

        <button id="btn-start" class="btn" style="display: none;" onclick="navigateTo('screen-quest')">НАЧАТЬ КВЕСТ</button>
    </div>

   
    <!-- ЭКРАН 2: Описание квеста -->
    <div id="screen-quest" class="screen" onclick="skipTyping()">
        <img id="quest-avatar" src="" alt="Avatar">
        <div id="quest-text-container">
            <span id="quest-text"></span><span class="cursor">_</span>
        </div>
        <button id="btn-to-map" class="btn" onclick="navigateTo('screen-map'); event.stopPropagation();">В ПУТЬ!</button>
        
        <!-- Добавленный логотип снизу -->
        <img src="./assets/logo-bottom.png" class="logo-bottom-quest" alt="Jägermeister">
    </div>

   <!-- ЭКРАН 3: Карта (ISOMETRIC REDESIGN) -->
    <div id="screen-map" class="screen">
        <div class="map-header">
            <img src="./assets/logo-round.png" alt="Logo">
            <span id="progress-text">СОБРАНО: 0 / 8</span>
        </div>
        
        <!-- Новый прогресс-бар -->
        <div id="progress-blocks"></div>
        
        <div id="map-container" class="map-container">
            <!-- Угловые декоры через CSS -->
            <div class="map-decor top-left">⬥</div>
            <div class="map-decor bottom-right">⬥</div>

            <!-- СЛОЙ 1: Базовый terrain генерируется через JS -->
            <div id="iso-terrain"></div>

            <!-- СЛОЙ 5: Река -->
            <div id="iso-river"></div>

            <!-- СЛОЙ 6: Дороги -->
            <svg class="map-roads" style="position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:4">
                <path id="road-shadow" stroke="#3a2000" stroke-width="10" fill="none" stroke-linejoin="round"/>
                <path id="road-main" stroke="#C8A44A" stroke-width="7" fill="none" stroke-linejoin="round" stroke-dasharray="8 2"/>
                <path id="road-lines" stroke="#8B6914" stroke-width="1" fill="none" stroke-dasharray="2 8"/>
            </svg>

            <!-- СЛОЙ 4: Деревья -->
            <div id="iso-trees"></div>

            <!-- Маркеры баров (рендерит JS) -->
            <div id="map-markers"></div>

            <!-- Персонаж на карте -->
            <div id="player-sprite" class="map-hero" style="display: none;"></div>
        </div>
        
        <button id="btn-elixir" class="btn" style="display: none; margin-top: 15px;" onclick="startElixirAnimation()">🧪 СОЗДАТЬ ЭЛИКСИР</button>
    </div>

    <!-- ИЗОМЕТРИЧЕСКОЕ МОДАЛЬНОЕ ОКНО -->
    <div id="iso-modal-overlay" class="iso-modal-overlay" onclick="closeModal()">
        <div class="iso-modal" onclick="event.stopPropagation()">
            <div class="iso-modal-content">
                <div class="iso-modal-left" id="iso-icon-container">
                    <!-- Здесь будет мини-здание бара -->
                </div>
                <div class="iso-modal-right">
                    <div class="rpg-title" id="rpg-title">BAR NAME</div>
                    <div class="rpg-artifact" id="rpg-artifact">Артефакт: Неизвестно</div>
                    <div class="rpg-hint" id="rpg-hint">Сходи в этот бар, чтобы узнать тайну.</div>
                    <div class="rpg-status" id="rpg-status">❌ НЕ СОБРАН</div>
                </div>
            </div>
            <div class="rpg-buttons">
                <button class="btn rpg-btn" id="btn-scan" onclick="openScanner()">СКАНИРОВАТЬ QR</button>
                <button class="btn rpg-btn" onclick="closeModal()">✕ ЗАКРЫТЬ</button>
            </div>
            <div class="iso-cursor">▼</div>
        </div>
    </div>

    <!-- ЭКРАН 4: Эликсир -->
    <div id="screen-elixir" class="screen">
        <div id="flash-overlay" class="flash"></div>
        <div class="elixir-container" id="elixir-container">
            <div id="big-bottle" class="big-bottle">🍾</div>
        </div>
    </div>

    <!-- ЭКРАН 5: Победа -->
    <div id="screen-victory" class="screen">
        <h1 class="title">🎉 ПОЗДРАВЛЯЕМ,<br><span id="winner-name"></span></h1>
        <p style="font-size: 10px; margin-top: 10px;">Ты собрал все ингредиенты и создал легендарный эликсир Jägermeister!</p>
        
        <div class="prizes" id="prize-container">
            <div class="prize-card pixel-border" onclick="selectPrize(this)">
                <div class="prize-icon">🎽</div>
                <span>МЕРЧ</span>
            </div>
            <div class="prize-card pixel-border gold" onclick="selectPrize(this)">
                <div class="prize-icon">🍾</div>
                <span>БУТЫЛКА JÄGER</span>
            </div>
        </div>
        <p id="prize-msg" style="display: none; color: var(--gold); margin-top: 20px; font-size: 10px;"></p>
        
        <button id="btn-reset" class="btn" onclick="confirmReset()">СЫГРАТЬ СНОВА</button>
    </div>
</div>

<script>
    // Инициализация Telegram SDK
    const tg = window.Telegram.WebApp;
    tg.ready();
    // ТВОЙ TELEGRAM ID (впиши сюда свой номер)
    const ADMIN_TG_ID = 620058644; 

    // Если приложение открыл админ — показываем панель
    if (tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.id === ADMIN_TG_ID) {
        document.getElementById('dev-panel').style.setProperty('display', 'flex', 'important');
    }
    tg.expand();
    tg.setHeaderColor('#1A1A1A');
    tg.setBackgroundColor('#1A1A1A');

    // Конфигурация и Данные
    const HUNTER_IMG_URL = "./assets/hunter.png";
    const HUNTIE_IMG_URL = "./assets/hanti.png";
    const INGREDIENTS = [
        { id: 1, name: "Имбирь", icon: "🫚", qrCode: "JAGER_BAR_1", bar: "Bar Name 1", hint: "Острый и жгучий корень", x: 20, y: 12 },
        { id: 2, name: "Корица", icon: "🌰", qrCode: "JAGER_BAR_2", bar: "Bar Name 2", hint: "Согревающая кора дерева", x: 75, y: 22 },
        { id: 3, name: "Звёздчатый анис", icon: "⭐", qrCode: "JAGER_BAR_3", bar: "Bar Name 3", hint: "Пряная звезда востока", x: 30, y: 35 },
        { id: 4, name: "Кардамон", icon: "🌿", qrCode: "JAGER_BAR_4", bar: "Bar Name 4", hint: "Семена тропического рая", x: 80, y: 48 },
        { id: 5, name: "Апельсиновая цедра", icon: "🍊", qrCode: "JAGER_BAR_5", bar: "Bar Name 5", hint: "Горькая корка померанца", x: 25, y: 60 },
        { id: 6, name: "Шафран", icon: "🌸", qrCode: "JAGER_BAR_6", bar: "Bar Name 6", hint: "Редчайшая специя мира", x: 70, y: 72 },
        { id: 7, name: "Можжевельник", icon: "🫐", qrCode: "JAGER_BAR_7", bar: "Bar Name 7", hint: "Лесные синие ягоды", x: 35, y: 85 },
        { id: 8, name: "Лакрица", icon: "🖤", qrCode: "JAGER_BAR_8", bar: "Bar Name 8", hint: "Сладкий корень солодки", x: 65, y: 92 }
    ];

    const STATE = {
        selectedCharacter: null,
        collectedIds: [],
        gameCompleted: false,
        currentScreen: 'screen-character'
    };

    // Web Audio API
    let audioCtx = null;
    function playBeep(freq, ms) {
        try {
            if (!audioCtx) {
                const AC = window.AudioContext || window.webkitAudioContext;
                if (!AC) return;
                audioCtx = new AC();
            }
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'square';
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + (ms/1000));
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            osc.start();
            osc.stop(audioCtx.currentTime + (ms/1000));
        } catch(e) { console.error('Audio play error:', e); }
    }

    // Хранение состояния
    const STORAGE_KEY = 'jager_quest_state';

    function saveState() {
        const data = JSON.stringify(STATE);
        try {
            if (tg.CloudStorage) {
                tg.CloudStorage.setItem(STORAGE_KEY, data, (err) => {
                    if (err) localStorage.setItem(STORAGE_KEY, data);
                });
            } else {
                localStorage.setItem(STORAGE_KEY, data);
            }
        } catch (e) {
            localStorage.setItem(STORAGE_KEY, data);
        }
    }

    function loadState(callback) {
        const parseState = (dataStr) => {
            if (dataStr) {
                try {
                    const parsed = JSON.parse(dataStr);
                    Object.assign(STATE, parsed);
                } catch(e) {}
            }
            callback();
        };

        try {
            if (tg.CloudStorage) {
                tg.CloudStorage.getItem(STORAGE_KEY, (err, val) => {
                    if (err || !val) {
                        parseState(localStorage.getItem(STORAGE_KEY));
                    } else {
                        parseState(val);
                    }
                });
            } else {
                parseState(localStorage.getItem(STORAGE_KEY));
            }
        } catch (e) {
            parseState(localStorage.getItem(STORAGE_KEY));
        }
    }

    // Навигация
    function navigateTo(screenId) {
        STATE.currentScreen = screenId;
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active-screen'));
        document.getElementById(screenId).classList.add('active-screen');
        saveState();

        if (screenId === 'screen-quest') initQuestScreen();
        if (screenId === 'screen-map') renderMap();
        if (screenId === 'screen-victory') initVictoryScreen();
        tg.MainButton.hide(); 
    }

    // Экран 1
    function selectCharacter(charId) {
        playBeep(440, 100);
        STATE.selectedCharacter = charId;
        
        document.querySelectorAll('.char-card').forEach(el => el.classList.remove('selected'));
        const activeCard = document.querySelector(`.char-card[data-char="${charId}"]`);
        activeCard.classList.add('selected');
        
        setTimeout(() => {
            document.getElementById('btn-start').style.display = 'block';
            saveState();
        }, 600);
    }

    // Экран 2
    let typeTimeout;
    let isTyping = false;
    const questTextStr = "Среди 56 секретных ингредиентов Jägermeister 8 главных затеряны по барам города. Твоя миссия — обойти бары, сканировать QR-коды и собрать все ингредиенты. Только тогда ты сможешь создать легендарный эликсир!";
    
    function initQuestScreen() {
        const avatarUrl = STATE.selectedCharacter === 'hunter' ? HUNTER_IMG_URL : HUNTIE_IMG_URL;
        document.getElementById('quest-avatar').src = avatarUrl;
        
        const starsContainer = document.getElementById('screen-quest');
        for(let i=0; i<15; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.animation = `pulse ${1 + Math.random()}s infinite alternate`;
            starsContainer.appendChild(star);
        }

        const textEl = document.getElementById('quest-text');
        textEl.innerText = "";
        document.getElementById('btn-to-map').style.display = "none";
        
        let charIdx = 0;
        isTyping = true;

        function nextChar() {
            if (!isTyping) return;
            if (charIdx < questTextStr.length) {
                textEl.innerText += questTextStr.charAt(charIdx);
                charIdx++;
                typeTimeout = setTimeout(nextChar, 35);
            } else {
                finishTyping();
            }
        }
        nextChar();
    }

    function skipTyping() {
        if(isTyping) finishTyping();
    }

    function finishTyping() {
        isTyping = false;
        clearTimeout(typeTimeout);
        document.getElementById('quest-text').innerText = questTextStr;
        setTimeout(() => {
            document.getElementById('btn-to-map').style.display = 'block';
        }, 500);
    }

   // --- ИЗОМЕТРИЧЕСКАЯ ЛОГИКА КАРТЫ ---
    const BAR_POSITIONS = [
        { id:1, left:8,  top:8  },
        { id:2, left:55, top:14 },
        { id:3, left:12, top:28 },
        { id:4, left:58, top:34 },
        { id:5, left:8,  top:50 },
        { id:6, left:55, top:56 },
        { id:7, left:12, top:70 },
        { id:8, left:55, top:76 },
    ];

    function renderMap() {
        document.getElementById('progress-text').innerText = `СОБРАНО: ${STATE.collectedIds.length} / 8`;
        
        const progressContainer = document.getElementById('progress-blocks');
        progressContainer.innerHTML = '';
        for (let i = 0; i < 8; i++) {
            const block = document.createElement('div');
            block.className = 'progress-block' + (i < STATE.collectedIds.length ? ' filled' : '');
            progressContainer.appendChild(block);
        }

        // 1. Рендер изо-сетки земли (8x10)
        const terrainContainer = document.getElementById('iso-terrain');
        const riverContainer = document.getElementById('iso-river');
        const treesContainer = document.getElementById('iso-trees');
        
        if (terrainContainer.innerHTML === '') {
            const tileW = 64; const tileH = 32;
            const offsetX = 180; // центрирование сетки
            const offsetY = 20;

            for (let row = 0; row < 10; row++) {
                for (let col = 0; col < 8; col++) {
                    const isoX = offsetX + (col - row) * (tileW / 2);
                    const isoY = offsetY + (col + row) * (tileH / 2);
                    
                    const tile = document.createElement('div');
                    tile.style.left = `${isoX}px`;
                    tile.style.top = `${isoY}px`;
                    
                    if (col === 4) {
                        tile.className = 'iso-tile tile-water';
                        riverContainer.appendChild(tile);
                    } else {
                        tile.className = `iso-tile ${(row + col) % 2 === 0 ? 'tile-grass' : 'tile-grass2'}`;
                        terrainContainer.appendChild(tile);
                    }
                }
            }

            // Добавляем деревья
            const treePositions = [
                {x: 20, y: 100}, {x: 40, y: 120}, {x: 10, y: 150},
                {x: 300, y: 80}, {x: 330, y: 110}, {x: 290, y: 140},
                {x: 30, y: 350}, {x: 60, y: 380}, {x: 20, y: 420},
                {x: 310, y: 360}, {x: 340, y: 390}, {x: 320, y: 430}
            ];
            treePositions.forEach(pos => {
                const tree = document.createElement('div');
                tree.className = 'iso-tree';
                tree.style.left = `${pos.x}px`;
                tree.style.top = `${pos.y}px`;
                tree.innerHTML = '<div class="iso-tree-trunk"></div><div class="iso-tree-top"></div>';
                treesContainer.appendChild(tree);
            });
        }

        // 2. Генерация Изометрических баров
        const markersContainer = document.getElementById('map-markers');
        markersContainer.innerHTML = '';
        
        let pointsString = '';
        let lastCollectedLeft = null;
        let lastCollectedTop = null;

        BAR_POSITIONS.forEach((pos, index) => {
            const item = INGREDIENTS.find(ing => ing.id === pos.id);
            const isCollected = STATE.collectedIds.includes(item.id);

            pointsString += `${pos.left}%,${pos.top}% `;

            if (isCollected) {
                lastCollectedLeft = pos.left;
                lastCollectedTop = pos.top;
            }

            const marker = document.createElement('div');
            marker.className = `bar-pin ${isCollected ? 'collected' : 'uncollected'}`;
            marker.style.left = `${pos.left}%`;
            marker.style.top = `${pos.top}%`;
            marker.onclick = () => openModal(item, isCollected, index + 1);

            marker.innerHTML = `
              <div class="iso-building">
                <div class="iso-front"></div>
                <div class="iso-side"></div>
                <div class="iso-roof"></div>
                <div class="iso-sign">Bar</div>
                <div class="bar-status"></div>
              </div>
              <div class="bar-number">${index + 1}</div>
              <div class="bar-name">${item.bar}</div>
            `;
            markersContainer.appendChild(marker);
        });

        // 3. SVG-дороги
        const cleanPoints = pointsString.trim();
        document.getElementById('road-shadow').setAttribute('d', `M ${cleanPoints.replace(/ /g, ' L ')}`);
        document.getElementById('road-main').setAttribute('d', `M ${cleanPoints.replace(/ /g, ' L ')}`);
        document.getElementById('road-lines').setAttribute('d', `M ${cleanPoints.replace(/ /g, ' L ')}`);

        // 4. Позиционирование изо-персонажа
        const player = document.getElementById('player-sprite');
        const avatarUrl = STATE.selectedCharacter === 'huntie' ? './assets/hanti.png' : './assets/hunter.png';
        player.style.backgroundImage = `url('${avatarUrl}')`;

        if (lastCollectedLeft !== null) {
            player.style.display = 'block';
            player.style.left = `${lastCollectedLeft}%`;
            player.style.top = `${lastCollectedTop}%`;
        } else if (BAR_POSITIONS.length > 0) {
            player.style.display = 'block';
            player.style.left = `${BAR_POSITIONS[0].left}%`;
            player.style.top = `${BAR_POSITIONS[0].top}%`;
        }

        if (STATE.collectedIds.length === 8) {
            document.getElementById('btn-elixir').style.display = 'block';
        } else {
            document.getElementById('btn-elixir').style.display = 'none';
        }
    }

    function openModal(item, isCollected, stepNum) {
        document.getElementById('rpg-title').innerText = item.bar;
        
        // Рендерим мини-копию здания бара в модалку
        document.getElementById('iso-icon-container').innerHTML = `
            <div class="iso-building" style="${isCollected ? 'filter: drop-shadow(0 0 6px var(--jager-gold));' : 'filter: grayscale(80%) brightness(0.6);'}">
                <div class="iso-front"></div>
                <div class="iso-side"></div>
                <div class="iso-roof"></div>
            </div>
        `;

        if (isCollected) {
            document.getElementById('rpg-artifact').innerText = `Артефакт: ${item.name} ${item.icon}`;
            document.getElementById('rpg-hint').innerText = item.hint;
            document.getElementById('rpg-status').innerHTML = '✅ СОБРАН';
            document.getElementById('rpg-status').style.color = "#4CAF50";
            document.getElementById('btn-scan').style.display = 'none';
        } else {
            document.getElementById('rpg-artifact').innerText = 'Артефакт: Неизвестно';
            document.getElementById('rpg-hint').innerText = `Следуй в эту локацию. Подсказка: ${item.hint}`;
            document.getElementById('rpg-status').innerHTML = '❌ НЕ СОБРАН';
            document.getElementById('rpg-status').style.color = "#ff4444";
            document.getElementById('btn-scan').style.display = 'block';
        }
        
        document.getElementById('iso-modal-overlay').style.display = 'flex';
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.HapticFeedback.impactOccurred('light');
        }
    }

    function closeModal() {
        document.getElementById('iso-modal-overlay').style.display = 'none';
    }

   

    function openScanner() {
        tg.showScanQrPopup({ text: "Наведи камеру на QR-код в баре" }, (scannedText) => {
            handleQrScan(scannedText);
            return true; 
        });
    }

    function handleQrScan(text) {
        const ing = INGREDIENTS.find(i => i.qrCode === text);
        if (!ing) {
            tg.showAlert("❌ Неверный QR-код. Попробуй в другом баре!");
            return;
        }
        if (STATE.collectedIds.includes(ing.id)) {
            tg.showAlert("✅ Этот ингредиент уже собран!");
            return;
        }

        // Новый ингредиент
        STATE.collectedIds.push(ing.id);
        saveState();
        tg.HapticFeedback.notificationOccurred('success');
        
        // Мелодия победы
        setTimeout(() => playBeep(523, 200), 0);
        setTimeout(() => playBeep(659, 200), 250);

        closeModal();
        renderMap(); // Перерисовка с обновленным прогрессом
        const slot = document.getElementById(`slot-${ing.id}`);
        if(slot) slot.classList.add('revealed');
    }

    // Экран 4
    function startElixirAnimation() {
        STATE.gameCompleted = true;
        saveState();
        navigateTo('screen-elixir');
        
        const container = document.getElementById('elixir-container');
        const radius = 120;
        
        // Создаем иконки по кругу
        INGREDIENTS.forEach((ing, i) => {
            const angle = (i / 8) * (2 * Math.PI);
            const el = document.createElement('div');
            el.className = 'flying-icon';
            el.innerText = ing.icon;
            
            const x = Math.cos(angle) * radius;
            const y = Math.sin(angle) * radius;
            el.style.transform = `translate(${x}px, ${y}px)`;
            
            container.appendChild(el);
            
            // Запуск стягивания к центру
            setTimeout(() => {
                el.style.transform = 'translate(0, 0)';
            }, 100);
        });

        // Нарастающая мелодия
        const notes = [261, 329, 392, 523];
        notes.forEach((freq, idx) => {
            setTimeout(() => playBeep(freq, 150), 100 + (idx * 200));
        });

        setTimeout(() => {
            document.querySelectorAll('.flying-icon').forEach(el => el.style.opacity = '0');
            const flash = document.getElementById('flash-overlay');
            flash.style.opacity = '1';
            
            setTimeout(() => {
                flash.style.transition = 'opacity 0.5s';
                flash.style.opacity = '0';
                const bottle = document.getElementById('big-bottle');
                bottle.style.transform = 'translate(-50%, -50%) scale(1)';
                bottle.style.opacity = '1';
            }, 200);

            setTimeout(() => {
                navigateTo('screen-victory');
            }, 2500);

        }, 800);
    }

    // Экран 5
    function initVictoryScreen() {
        document.getElementById('winner-name').innerText = STATE.selectedCharacter.toUpperCase();
        
        const container = document.getElementById('screen-victory');
        for(let i=0; i<20; i++) {
            const conf = document.createElement('div');
            conf.className = 'confetti';
            conf.style.left = Math.random() * 100 + '%';
            conf.style.backgroundColor = Math.random() > 0.5 ? 'var(--green)' : 'var(--gold)';
            conf.style.animationDuration = (Math.random() * 2 + 2) + 's';
            conf.style.animationDelay = (Math.random() * 2) + 's';
            container.appendChild(conf);
        }
    }

    function selectPrize(element) {
        document.querySelectorAll('.prize-card').forEach(el => el.classList.add('dim'));
        element.classList.remove('dim');
        
        tg.HapticFeedback.notificationOccurred('success');
        
        const msg = document.getElementById('prize-msg');
        msg.style.display = 'block';
        msg.innerText = "ОТЛИЧНЫЙ ВЫБОР! 🎯 Покажи этот экран бармену для получения приза.";
        
        tg.MainButton.setText('✅ ПОКАЗАТЬ БАРМЕНУ').show();
        tg.MainButton.onClick(() => {
            tg.showAlert("Приз выдан! Наслаждайся Jägermeister!");
            tg.MainButton.hide();
        });
    }

    function confirmReset() {
        tg.showConfirm("Сбросить прогресс и начать заново?", (ok) => {
            if(ok) resetGame();
        });
    }

    function resetGame() {
        STATE.selectedCharacter = null;
        STATE.collectedIds = [];
        STATE.gameCompleted = false;
        STATE.currentScreen = 'screen-character';
        
        if(tg.CloudStorage) tg.CloudStorage.removeItem(STORAGE_KEY);
        localStorage.removeItem(STORAGE_KEY);
        
        document.querySelectorAll('.char-card').forEach(el => el.classList.remove('selected'));
        document.getElementById('btn-start').style.display = 'none';
        document.getElementById('prize-msg').style.display = 'none';
        document.querySelectorAll('.prize-card').forEach(el => el.classList.remove('dim'));
        document.getElementById('elixir-container').innerHTML = '<div id="big-bottle" class="big-bottle">🍾</div>';
        
        document.querySelectorAll('.confetti').forEach(e => e.remove());
        
        navigateTo('screen-character');
    }

    // Загрузка при старте
    loadState(() => {
        if (STATE.currentScreen && document.getElementById(STATE.currentScreen)) {
            navigateTo(STATE.currentScreen);
        } else {
            navigateTo('screen-character');
        }
    });
    // ==========================================
    // --- ФУНКЦИИ ДЛЯ ТЕСТИРОВАНИЯ (DEV) ---
    // ==========================================
    
    // Эмулирует сканирование одного (следующего) QR-кода
    function devAddQR() {
        const missing = INGREDIENTS.find(i => !STATE.collectedIds.includes(i.id));
        if (missing) {
            handleQrScan(missing.qrCode);
        } else {
            tg.showAlert("Все 8 ингредиентов уже собраны!");
        }
    }

    // Мгновенно собирает все 8 ингредиентов
    function devWin() {
        STATE.collectedIds = [1, 2, 3, 4, 5, 6, 7, 8];
        saveState();
        if (STATE.currentScreen === 'screen-map') {
            renderMap();
        } else {
            navigateTo('screen-map');
        }
        tg.showAlert("Чит активирован: Собраны все ингредиенты!");
    }

</script>
</body>
</html>
